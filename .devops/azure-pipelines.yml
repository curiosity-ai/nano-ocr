# Publishes NanoOCR to nuget.org on every push to main, the same way sentence-transformers-sharp
# publishes its packages: one CalVer version (yy.M.<buildId>) stamped on every package of a run,
# pushed through the 'nuget-curiosity-org' service connection.
#
# Packages:
#   NanoOCR             src/NanoOcr       the library, models embedded
#   NanoOCR.Cli         src/NanoOcr.Cli   the nano-ocr .NET tool: a small pointer package ...
#   NanoOCR.Cli.<rid>                     ... and one package per runtime (RuntimeIdentifiers in the
#                                         csproj), each with only that platform's PDFium and SkiaSharp.
#                                         `dotnet tool install` picks the right one (.NET 10 SDK).
#
# The tool is packed with `dotnet pack`: a RID-specific tool can't be packed by GeneratePackageOnBuild.
# The RID packages are pushed before the pointer package, so an install never finds the pointer
# without the package it points to.

variables:
  projectLibrary:     './src/NanoOcr/NanoOcr.csproj'
  projectCli:         './src/NanoOcr.Cli/NanoOcr.Cli.csproj'
  solution:           './NanoOcr.slnx'
  buildConfiguration: 'Release'
  targetVersion:      yy.M.$(build.buildId)
  packageDir:         '$(Build.ArtifactStagingDirectory)/packages'

pool:
  vmImage: 'windows-latest'

trigger:
- main

steps:
- checkout: self
  fetchDepth: 10

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: DotNetCoreCLI@2
  displayName: 'restore nuget'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'pack NanoOCR'
  inputs:
    command: 'custom'
    custom: 'pack'
    projects: '$(projectLibrary)'
    arguments: '-c $(buildConfiguration) -o $(packageDir) /p:Version=$(targetVersion)'

- task: DotNetCoreCLI@2
  displayName: 'pack NanoOCR.Cli (pointer + one package per runtime)'
  inputs:
    command: 'custom'
    custom: 'pack'
    projects: '$(projectCli)'
    arguments: '-c $(buildConfiguration) -o $(packageDir) /p:Version=$(targetVersion)'

- task: NuGetCommand@2
  displayName: 'push NanoOCR and the NanoOCR.Cli runtime packages'
  inputs:
    command: 'push'
    packagesToPush: '$(packageDir)/*.nupkg;!$(packageDir)/NanoOCR.Cli.$(targetVersion).nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'

- task: NuGetCommand@2
  displayName: 'push the NanoOCR.Cli pointer package'
  inputs:
    command: 'push'
    packagesToPush: '$(packageDir)/NanoOCR.Cli.$(targetVersion).nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
